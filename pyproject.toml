[project]
name = "shalomb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=5.0",
]

# This repo is a website, not a Python package. Without this, `pip install .`
# (run by Cloudflare Pages when it sees a pyproject.toml) fails because
# setuptools finds several top-level folders (cv, js, img, ...) and refuses to guess.
[tool.setuptools]
packages = []
